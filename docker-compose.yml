name: lionbartender

services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-lionbartender}
      MYSQL_USER: ${MYSQL_USER:-nerman}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-changeme}
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: wordpress:7.0.0-php8.4
    depends_on:
      - db
    restart: always
    ports:
      - "${WP_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: ${MYSQL_USER:-nerman}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-changeme}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-lionbartender}
    volumes:
      - ./wp-content:/var/www/html/wp-content
      - ./wordpress/custom.ini:/usr/local/etc/php/conf.d/custom.ini

volumes:
  db_data:
