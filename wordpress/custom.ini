; kích thước file tối đa được phép upload
upload_max_filesize = 512M
post_max_size = 512M

; Giới hạn bộ nhớ và thời gian thực thi
memory_limit = 1024M
max_execution_time = 900

; Hiển thị lỗi để tiện debug (Tắt đi khi lên Production)
; display_errors = On
; display_startup_errors = On
; error_reporting = E_ALL

; Cấu hình múi giờ
date.timezone = Asia/Ho_Chi_Minh
